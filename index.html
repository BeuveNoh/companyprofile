<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소개서 기획 가이드 — 플롯 유형 × 구성항목</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple-bg: #EEF2FF; --purple-mid: #615FFF; --purple-dark: #312C85; --purple-deep: #1E1A4D;
    --blue-bg: #EFF6FF; --blue-mid: #51A2FF; --blue-dark: #193CB8; --blue-border: #DBEAFE;
    --green-bg: #F7FEE7; --green-mid: #9AE600; --green-dark: #3D6300; --green-border: #D8F999;
    --gray-bg: #F9FAFB; --gray-mid: #D1D5DC; --gray-dark: #364153; --grey-border: #E5E7EB;
    --amber-bg: #FEFCE8; --amber-mid: #FFDF20; --amber-dark: #432004;
    --white: #FFFFFF; --off: #F8FAFC; --border: #E2E8F0;
    --text: #404040; --text-sub: #525252; --text-muted: #737373;
  }
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", -apple-system, sans-serif;
    background: var(--off);
    color: var(--text);
  }

  /* ── Header ── */
  .site-header {
    background: var(--purple-deep);
    padding: 20px 32px;
    display: flex; align-items: center; gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-header .logo { width: 36px; height: 36px; background: #7C86FF; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .site-header h1 { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: -0.2px; }
  .site-header p  { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  /* ── Layout ── */
  .main {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    height: calc(100vh - 77px - 42px);
    min-height: 0;
  }

  /* ── Sidebar ── */
  .sidebar {
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 20px 0;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
    height: 100%;
    min-height: 0;
    position: sticky;
    top: 77px;
    display: flex;
    flex-direction: column;
  }
  .sidebar-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase;
    padding: 0 20px 10px;
  }
  .story-btn {
    display: block; width: 100%; text-align: left;
    padding: 12px 20px;
    background: none; border: none; border-left: 3px solid transparent;
    cursor: pointer; transition: all 0.15s;
  }
  .story-btn:hover { background: var(--off); }
  .story-btn.active { background: var(--purple-bg); border-left-color: var(--purple-mid); }
  .story-btn .snum { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
  .story-btn .sname { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .story-btn .stag { font-size: 11px; font-weight: 500; color: var(--text-sub); margin-top: 2px; }
  .story-btn.active .sname { color: var(--purple-dark); }
  .story-btn.active .stag  { color: var(--purple-mid); }
  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 20px; }

  /* ── Content ── */
  .content {
    padding: 28px 32px;
    overflow-y: auto;
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* Placeholder */
  .placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 400px; color: var(--text-muted); gap: 12px;
  }
  .placeholder-icon { font-size: 40px; opacity: 0.4; }
  .placeholder p { font-size: 15px; }

  /* Card header */
  .card-header {
    background: var(--purple-dark);
    border-radius: 12px 12px 0 0;
    padding: 18px 24px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .card-header .big-num { font-size: 24px; font-weight: 700; line-height: 1.1; color: rgba(255,255,255,0.3); }
  .card-header .title-wrap { flex: 1; }
  .card-header h2 { font-size: 20px; font-weight: 500; color: #fff; }
  .card-header .tag-badge {
    display: inline-block; background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.85); font-size: 11px; font-weight: 600;
    padding: 3px 12px 5px; border-radius: 20px; margin-top: 4px;
  }

  /* Card body */
  .card-body {
    background: var(--white);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  /* Desc + flow */
  .card-desc {
    padding: 16px 24px;
    font-size: 14px; color: var(--text-sub); line-height: 1.65; letter-spacing: -0.02em;
    border-bottom: 1px solid var(--border);
    background: var(--off);
  }

  .flow-section {
    padding: 14px 24px;
  }
  .flow-section-label { font-size: 12px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase;  margin-bottom: 10px; }
  .flow-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .flow-step {
    background: var(--purple-bg); color: var(--purple-dark);
    font-size: 12px; font-weight: 500; padding: 5px 12px 6px; border-radius: 20px;
  }
  .flow-arrow { color: var(--text-muted); font-size: 12px; }

  /* Items section */
  .items-section { padding: 20px 24px; border-top: 1px solid var(--border); }
  .items-section:last-of-type { border-bottom: none; }
  .items-section-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }
  .tier-dot { width: 10px; height: 10px; border-radius: 50%; }
  .tier-dot.must  { background: var(--blue-mid); }
  .tier-dot.rec   { background: var(--green-mid); }
  .tier-dot.opt   { background: var(--gray-mid); }
  .tier-label { font-size: 12px; font-weight: 700; }
  .tier-label.must  { color: var(--blue-dark); }
  .tier-label.rec   { color: var(--green-dark); }
  .tier-label.opt   { color: var(--gray-dark); }
  .tier-desc { font-size: 12px; color: var(--text-muted); }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2;
    font-size: 12px; font-weight: 500; padding: 5px 12px 6px;
    border-radius: 8px; border: 1px solid;
    transition: transform 0.1s;
  }
  .badge:hover { transform: translateY(-1px); }
  .badge.must { background: var(--blue-bg); color: var(--blue-dark); border-color: var(--blue-border); }
  .badge.rec  { background: var(--green-bg); color: var(--green-dark); border-color: var(--green-border); }
  .badge.opt  { background: var(--gray-bg); color: var(--gray-dark); border-color: var(--grey-border); }
  .badge .bnum { font-size: 10px; opacity: 0.6; font-weight: 700;}

  /* Tip */
  .tip-box {
    margin: 0; padding: 16px 24px 17px;
    background: var(--amber-bg);
    border-top: 1px solid #FAC775;
    display: flex; gap: 10px; align-items: center;
  }
  .tip-icon { font-size: 15px; flex-shrink: 0; }
  .tip-text { font-size: 13px; color: var(--amber-dark); align-items: center; }

  /* Matrix tab */
  .tab-bar {
    display: flex; gap: 0; border-bottom: 2px solid var(--border);
    margin-bottom: 24px;
  }
  .tab-btn {
    padding: 10px 20px; font-size: 13px; font-weight: 600;
    background: none; border: none; border-bottom: 2px solid transparent;
    margin-bottom: -2px; cursor: pointer; color: var(--text-muted);
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--purple-dark); border-bottom-color: var(--purple-dark); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Matrix table */
  .matrix-wrap {
    flex: 1;
    min-height: 200px;
    overflow-y: auto;
    overflow-x: auto;
  }
  .matrix-table {
    border-collapse: separate;
    border-spacing: 0;
   
    border-right: 0; 
    border-bottom: 0;
    width: 100%;
    font-size: 13px;
    min-width: 900px;
    background: #fff;
  }
  
  .matrix-table th {
    background: var(--purple-dark); color: #fff;
    padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 500;
    position: sticky; top: 0;
    z-index: 2;
    box-sizing: border-box;
    border-bottom: 1px solid var(--off);
    border-right: 1px solid var(--off);
  }

  .matrix-table th:first-child {
    width: 32px;
    min-width: 32px;
    max-width: 32px;
    padding-left: 0;
    padding-right: 0;
  }
  .matrix-table th:nth-child(2) {
    min-width: 120px;
    max-width: 180px;
    width: 160px;
  }
  .matrix-table th:not(:first-child):not(:nth-child(2)) {
    min-width: 90px;
    max-width: 90px;
    width: 90px;
  }
  .matrix-table .item-num {
    color: var(--gray-dark);
    font-weight: 400;
    text-align: center;
    background: transparent;
  }
  .matrix-table .item-name {
    font-size: 13px;
    color: var(--text);
    padding: 6px 10px;
    min-width: 140px;
    max-width: 180px;
    width: 160px;
    text-align: left;
    box-sizing: border-box;
    word-break: keep-all;
  }
  .matrix-table .sec-label {
    background: #F0EFFD;
    color: var(--purple-dark);
    font-weight: 700;
    font-size: 13px;
    align-items: center;
    padding: 8px 12px;
    text-align: left;
  }
  .matrix-table td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 5px 4px; text-align: center; vertical-align: middle; }
  .matrix-table .m-must { background: var(--blue-bg); color: var(--blue-mid); font-weight: 700; font-size: 13px; }
  .matrix-table .m-rec  { background: var(--green-bg); color: var(--green-mid); font-weight: 700; font-size: 13px; }
  .matrix-table .m-opt  { background: var(--gray-bg); color: var(--gray-mid); font-weight: 700; font-size: 13px; }

  .matrix-table th:last-child,
  .matrix-table td:last-child {
    border-right: none !important;
  }

  /* Sidebar scrollbar — 평소엔 숨김, 스크롤 시 표시 */
  .sidebar::-webkit-scrollbar {
    width: 4px;
  }
  .sidebar::-webkit-scrollbar-track {
    background: transparent;
  }
  .sidebar::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 10px;
    transition: background-color 0.2s;
  }
  .sidebar:hover::-webkit-scrollbar-thumb {
    background: rgba(99, 117, 143, 0.15);
  }
  .sidebar:hover {
    scrollbar-color: rgba(99, 117, 143, 0.15) transparent;
  }

  /* 크롬, 사파리, 엣지용 */
  .matrix-wrap::-webkit-scrollbar {
    width: 6px;  /* 세로 스크롤바 두께 */
    height: 6px; /* 가로 스크롤바 두께 */
  }

  .matrix-wrap::-webkit-scrollbar-track {
    background: transparent; /* 스크롤바 길(선)을 투명하게 */
  }

  .matrix-wrap::-webkit-scrollbar-thumb {
    background: rgba(99, 117, 143, 0.15);
    border-radius: 10px;
  }

  .matrix-wrap::-webkit-scrollbar-thumb:hover {
    background: rgba(99, 117, 143, 0.25);
  }

  /* ── Footer ── */
  .site-footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--purple-deep);
    padding: 0 32px;
    height: 42px;
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .footer-links {
    display: flex; align-items: center; gap: 20px;
  }
  .footer-link {
    font-size: 12px; color: rgba(255,255,255,0.65);
    text-decoration: none;
    display: flex; align-items: center; gap: 5px;
    transition: color 0.15s;
    letter-spacing: -0.1px;
  }
  .footer-link:hover { color: rgba(255,255,255,1); }
  .footer-copyright {
    font-size: 11px; color: rgba(255,255,255,0.4);
    letter-spacing: -0.1px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
    .sidebar { height: auto; position: static; display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; }
    .story-btn { width: auto; border-left: none;  padding: 8px 12px; }
    .story-btn.active { border-bottom-color: var(--purple-mid); }
    .story-btn .snum, .story-btn .stag { display: none; }
    .sidebar-label, .sidebar-divider { display: none; }
    .content { padding: 16px; }
    .site-footer { padding: 0 16px; }
    .footer-links { gap: 12px; }
    .footer-copyright { display: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">📋</div>
  <div>
    <h1>소개서 기획 가이드 — 플롯 유형 × 구성항목</h1>
    <p>플롯 유형을 선택하면 체크리스트에서 어떤 항목을 써야 하는지 안내합니다</p>
  </div>
</header>

<div class="main">
  <nav class="sidebar">
    <div class="sidebar-label">플롯 유형 선택</div>
    <div id="storyNav"></div>
    <div class="sidebar-divider"></div>
    <button class="story-btn" id="matrixBtn" onclick="showMatrix()">
      <div class="snum">MATRIX</div>
      <div class="sname">전체 매핑 매트릭스</div>
      <div class="stag">유형 × 구성항목 한눈에 보기</div>
    </button>
  </nav>

  <main class="content" id="content">
    <div class="placeholder">
      <div class="placeholder-icon">◈</div>
      <p>왼쪽에서 플롯 유형을 선택해주세요</p>
    </div>
  </main>
</div>

<script>
const stories = [
  {
    num:"01", name:"차근차근", tag:"순차 설명형",
    desc:"시장 현황 → 원리 → 적용 순으로 단계적으로 소개. 독자가 서비스에 생소하거나 차별점을 명확히 인식하지 못한 경우에 특히 적합. 큰 개념에서 세부 개념으로 좁혀가며 서술합니다.",
    flow:["용어·개념 정의","시장 현황","작동 원리","핵심 역량","시장 접점","고객 혜택","신뢰 보강"],
    must:[[27,"시장 상황"],[18,"서비스 원리"],[13,"기대 효과"],[15,"주요 기능·특징"]],
    rec: [[25,"시장 규모"],[20,"보유 역량"],[37,"자주 묻는 질문"],[35,"주요 고객 유형"]],
    opt: [[51,"인증·특허"],[14,"서비스 세부 사항"],[12,"해결 방안"]],
    tip: "수치·출처를 가진 시장 현황(27)과 작동 원리(18)가 핵심. 투자자·발주처 대상이라면 주요 지표 현황(11)도 추가 검토하세요."
  },
  {
    num:"02", name:"속시원한 공감", tag:"문제 해결 제시형",
    desc:"독자가 겪고 있는 불편함이나 비효율에 공감한 뒤, 명쾌한 해결책을 제시하는 구성. 공감대 형성이 선행되어야 하며, 대다수가 경험한 보편적 문제를 소재로 삼아야 합니다.",
    flow:["문제 상황","기존 한계","자사 접근 배경","개선 효과","근거 자료","도입 절차","변화된 일상"],
    must:[[8,"문제 현상 파악"],[9,"핵심 문제 정의"],[12,"해결 방안"],[13,"기대 효과"]],
    rec: [[40,"인터뷰/리뷰"],[43,"비포애프터 그래프"],[17,"서비스 제공 절차"],[42,"비포애프터 이미지"]],
    opt: [[37,"자주 묻는 질문"],[6,"맺음말"],[10,"설문 결과"]],
    tip: "문제 현상(8)과 핵심 문제 정의(9)는 세트. '무슨 일이 일어나고 있나' → '진짜 문제가 뭔가' 순서로 흐름을 잡으세요."
  },
  {
    num:"03", name:"위로와 공감", tag:"감성 공감형",
    desc:"업무 부담이 큰 담당자(관리소장, 시설팀 담당자, 건물주, 주택관리사 등)를 주요 독자로 설정할 때 효과적. 문제 정의와 공감 포인트를 정확히 설정해야 역효과를 방지할 수 있습니다.",
    flow:["구체적 상황","불편 사항","원인·개선 가능성","해결 방향","달라진 환경","사례·원리","핵심 가치"],
    must:[[36,"고객 이용 시나리오"],[8,"문제 현상 파악"],[12,"해결 방안"],[41,"사용 이미지"]],
    rec: [[39,"서비스 제공 사례"],[18,"서비스 원리"],[13,"기대 효과"],[35,"주요 고객 유형"]],
    opt: [[40,"인터뷰/리뷰"],[6,"맺음말"],[5,"브랜드 철학"]],
    tip: "고객 이용 시나리오(36)에서 공감 포인트를 정밀하게 잡아야 역효과를 막을 수 있어요. 구구절절한 감성 표현보다 '상황의 정확한 묘사'가 핵심입니다."
  },
  {
    num:"04", name:"할 말만 정확히", tag:"핵심 집중형",
    desc:"서비스의 용도와 특징이 매우 명확하고 좁은 영역을 다룰 때 적합. 자사가 무엇을 하는지를 빠르게 전달하고, 시연 및 이용 방법 중심으로 구성합니다. 간결함이 이 유형의 생명입니다.",
    flow:["브랜드 소개","서비스 정의","비포애프터","주요 기능","수치·데이터","이용 방법","맺음말"],
    must:[[2,"브랜드 소개"],[15,"주요 기능·특징"],[42,"비포애프터 이미지"],[1,"슬로건"]],
    rec: [[43,"비포애프터 그래프"],[24,"서비스 요금 안내"],[22,"사용 방법"],[23,"제한 사항"]],
    opt: [[6,"맺음말"],[16,"부가 기능·특징"],[17,"서비스 제공 절차"]],
    tip: "마무리는 한 문장 맺음말(6)로 딱 끊으세요. 부가 기능(16) 언급을 최소화하고 주요 기능(15)에만 집중하세요."
  },
  {

// Build reverse map for matrix
const reverseMap = {};
stories.forEach(s => {
  const addTier = (items, key) => items.forEach(([n]) => {
    if (!reverseMap[n]) reverseMap[n] = {};
    reverseMap[n][s.num] = { symbol: '●', key };
  });
  addTier(s.must, 'must');
  addTier(s.rec,  'rec');
  addTier(s.opt,  'opt');
});

// Build nav
const nav = document.getElementById('storyNav');
stories.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = 'story-btn';
  btn.id = `btn-${s.num}`;
  btn.innerHTML = `<div class="snum">${s.num}</div><div class="sname">${s.name}</div><div class="stag">${s.tag}</div>`;
  btn.onclick = () => showStory(i);
  nav.appendChild(btn);
});

let activeStory = null;
let matrixActive = false;

function showStory(idx) {
  matrixActive = false;
  document.querySelectorAll('.story-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`btn-${stories[idx].num}`).classList.add('active');
  document.getElementById('matrixBtn').classList.remove('active');
  activeStory = idx;

  const s = stories[idx];
  const flowHtml = s.flow.map((f, i) =>
    `<span class="flow-step">${f}</span>${i < s.flow.length-1 ? '<span class="flow-arrow">→</span>' : ''}`
  ).join('');

  const badgesHtml = (items, cls) => items.map(([n, nm]) =>
    `<span class="badge ${cls}"><span class="bnum">${n}</span>${nm}</span>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <div class="card-header">
      <div class="big-num">${s.num}</div>
      <div class="title-wrap">
        <h2>${s.name}</h2>
        <span class="tag-badge">${s.tag}</span>
      </div>
    </div>
    <div class="card-body">
      <div class="card-desc">${s.desc}</div>
      <div class="flow-section">
        <div class="flow-section-label">구성 흐름</div>
        <div class="flow-steps">${flowHtml}</div>
      </div>
      <div class="items-section">
        <div class="items-section-header">
          <div class="tier-dot must"></div>
          <span class="tier-label must">필수 항목</span>
          <span class="tier-desc">— 이 흐름을 만들려면 꼭 필요해요</span>
        </div>
        <div class="badges">${badgesHtml(s.must, 'must')}</div>
      </div>
      <div class="items-section">
        <div class="items-section-header">
          <div class="tier-dot rec"></div>
          <span class="tier-label rec">권장 항목</span>
          <span class="tier-desc">— 설득력을 높여주는 강화 요소</span>
        </div>
        <div class="badges">${badgesHtml(s.rec, 'rec')}</div>
      </div>
      <div class="items-section">
        <div class="items-section-header">
          <div class="tier-dot opt"></div>
          <span class="tier-label opt">선택 항목</span>
          <span class="tier-desc">— 상황에 따라 추가 가능</span>
        </div>
        <div class="badges">${badgesHtml(s.opt, 'opt')}</div>
      </div>
      <div class="tip-box">
        <span class="tip-icon">💡</span>
        <span class="tip-text">${s.tip}</span>
      </div>
    </div>
  `;
}

function showMatrix() {
  matrixActive = true;
  document.querySelectorAll('.story-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('matrixBtn').classList.add('active');

  // Table header for stories
  const storyHeaders = stories.map(s =>
    `<th title="${s.name}">${s.num}<br>${s.name}</th>`
  ).join('');

  // Table body rows
  const matrixRows = checklist.map(({sec, items}) => {
    // Section label row
    const sectionRow = `<tr><td class="sec-label" colspan="${3 + stories.length}">${sec}</td></tr>`;
    // Item rows
    const itemRows = items.map(([num, name]) => {
      const tierCells = stories.map(s => {
        const t = reverseMap[num]?.[s.num];
        let cls = '';
        let symbol = '';
        if (t && typeof t === 'object') {
          cls = t.key === 'must' ? 'm-must' : t.key === 'rec' ? 'm-rec' : t.key === 'opt' ? 'm-opt' : '';
          symbol = t.symbol;
        } else {
          symbol = t || '';
        }
        return `<td class="${cls}">${symbol}</td>`;
      }).join('');
      return `<tr><td class="item-num">${num}</td><td class="item-name">${name}</td>${tierCells}</tr>`;
    }).join('');
    return sectionRow + itemRows;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div style="margin-bottom:16px;">
      <h2 style="font-size:18px;font-weight:700;color:var(--purple-dark);margin-bottom:6px;">전체 매핑 매트릭스</h2>
      <div style="display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-sub);flex-wrap:wrap;">
        <span>플롯 유형 × 구성항목 적합도 한눈에 보기</span>
        <span style="color:#D1D5DC;">|</span>
        <span class="badge must" style="font-size:11px;font-weight:600;padding:4px 8px 4px 8px;line-height:1;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border-width:1.5px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue-mid);"></span>
          필수
        </span>
        <span class="badge rec" style="font-size:11px;font-weight:600;padding:4px 8px 4px 8px;line-height:1;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border-width:1.5px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green-mid);"></span>
          권장
        </span>
        <span class="badge opt" style="font-size:11px;font-weight:600;padding:4px 8px 4px 8px;line-height:1;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border-width:1.5px;">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gray-mid);"></span>
          선택
        </span>
      </div>
    </div>
    <div class="matrix-wrap">
      <table class="matrix-table">
        <thead>
          <tr>
            <th>#</th>
            <th>항목명</th>
            ${storyHeaders}
          </tr>
        </thead>
        <tbody>${matrixRows}</tbody>
      </table>
    </div>
  `;
}
